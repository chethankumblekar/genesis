name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The snapshot is rebuilt daily, so yesterday's clean scan can be wrong
    # today without a line of this repository changing.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkstead scan
        uses: chethankumblekar/dependency-check-db-cache@main
        with:
          scan: .
          project: genesis
          output: checkstead-report

      # Kept whatever the outcome: a failing scan is exactly when the report
      # is worth reading.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstead-report
          path: checkstead-report/
          if-no-files-found: warn
          retention-days: 30
