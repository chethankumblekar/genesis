name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The snapshot is rebuilt daily, so yesterday's clean scan can be wrong
    # today without a line of this repository changing.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    # The action does three privileged things with the job token, and the
    # repository default is read-only, so each has to be granted explicitly:
    #   pull-requests  post the findings comment on a PR
    #   security-events  upload checkstead.sarif to the Security tab
    #   contents  checkout, and the base/head fetches for a PR diff scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkstead scan
        uses: chethankumblekar/dependency-check-db-cache@main
        with:
          scan: .
          project: genesis
          output: checkstead-report

      # Kept whatever the outcome: a failing scan is exactly when the report
      # is worth reading.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstead-report
          path: checkstead-report/
          if-no-files-found: warn
          retention-days: 30
