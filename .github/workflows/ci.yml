name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 to match the Dockerfile, so CI fails where production would.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `next build` runs TypeScript itself, so this covers typechecking too.
      # No DATABASE_URL: the app renders without one and reports the error in
      # the UI, and CI having to run Postgres to typecheck would be a smell.
      - name: Build
        run: npm run build
