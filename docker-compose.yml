# HouseHunting — Docker Desktop / Engine / Compose v2
#
#   git pull && docker compose up --build
#   open http://127.0.0.1:43123
#
# Docker Desktop → Containers should show househunting-db-1 and househunting-app-1.
#
# Host 5432 is usually taken by a local Postgres. The app talks to db over a
# socket, so this publish is only for host tools (`npm run dev`). Default 5433.
# If 5433 is also taken: DB_PORT=5434 docker compose up --build
# If host port 43123 is taken: APP_PORT=8080 docker compose up --build
# After a port change, recreate — Docker Desktop "Start" reuses the old bind:
#   docker compose down && docker compose up --build
#
# Data: Docker volume househunting_pg. Wipe with: docker compose down -v

name: househunting

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-househunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-househunting}
      POSTGRES_DB: ${POSTGRES_DB:-househunting}
    volumes:
      - househunting_pg:/var/lib/postgresql/data
      - househunting_pg_run:/var/run/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: househunting:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-43123}:43123"
    volumes:
      - househunting_pg_run:/var/run/postgresql
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "43123"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-househunting}:${POSTGRES_PASSWORD:-househunting}@/househunting?host=/var/run/postgresql
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  househunting_pg:
  househunting_pg_run:
