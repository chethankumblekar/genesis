# HouseHunting — portable Compose stack (Linux, macOS, Windows/Docker Desktop)
#
#   docker compose up --build
#   open http://127.0.0.1:43123
#
# Override the published host port without rebuilding:
#   APP_PORT=8080 docker compose up --build
#
# Listings persist in Postgres (volume `househunting_pg`). The app talks to Postgres over a shared socket volume so it works even when container TCP/ICC is restricted. Wipe data with: `docker compose down -v`
#
# Needs outbound HTTPS at runtime for map tiles, Nominatim geocode, and paste OG fetches.

name: househunting

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-househunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-househunting}
      POSTGRES_DB: ${POSTGRES_DB:-househunting}
    volumes:
      - househunting_pg:/var/lib/postgresql/data
      - househunting_pg_run:/var/run/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: househunting:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-43123}:43123"
    volumes:
      - househunting_pg_run:/var/run/postgresql
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "43123"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-househunting}:${POSTGRES_PASSWORD:-househunting}@/househunting?host=/var/run/postgresql
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  househunting_pg:
  househunting_pg_run:
