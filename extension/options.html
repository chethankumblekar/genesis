<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HouseHunting importer</title>
    <style>
      body {
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        max-width: 30rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #0f172a;
      }
      label { display: block; margin: 1.25rem 0 0.35rem; font-weight: 600; }
      input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      button { margin-top: 1.25rem; padding: 0.5rem 1rem; border: 0; border-radius: 6px; background: #0f172a; color: #f8fafc; font: inherit; cursor: pointer; }
      p.hint { color: #475569; font-size: 13px; }
      #saved { color: #059669; font-weight: 600; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>HouseHunting importer</h1>
    <label for="appUrl">App URL</label>
    <input id="appUrl" type="url" placeholder="http://127.0.0.1:43123" />
    <label for="token">Scrape token</label>
    <input id="token" type="password" placeholder="matches SCRAPE_TOKEN in your .env" />
    <p class="hint">Must match <code>SCRAPE_TOKEN</code> in the app's <code>.env</code>. Restart the app after changing it.</p>
    <button id="save">Save</button>
    <p id="saved"></p>
    <script src="options.js"></script>
  </body>
</html>
